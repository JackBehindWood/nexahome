# All hooks are local and run the tools pinned in requirements-dev.txt from ./.venv.
# No hook repositories are cloned, so nothing is cached outside this folder.
repos:
  - repo: local
    hooks:
      - id: detect-secrets
        name: detect secrets
        entry: .venv/bin/detect-secrets-hook
        language: system
        types: [text]
      - id: detect-private-key
        name: detect private keys
        entry: .venv/bin/detect-private-key
        language: system
        types: [text]
      - id: check-added-large-files
        name: check added large files
        entry: .venv/bin/check-added-large-files --maxkb=500
        language: system
      - id: check-yaml
        name: check yaml
        entry: .venv/bin/check-yaml
        language: system
        types: [yaml]
      - id: end-of-file-fixer
        name: fix end of files
        entry: .venv/bin/end-of-file-fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: .venv/bin/trailing-whitespace-fixer
        language: system
        types: [text]
      - id: no-commit-to-branch
        name: no direct commits to main or dev
        entry: .venv/bin/no-commit-to-branch --branch main --branch dev
        language: system
        pass_filenames: false
        always_run: true
      - id: personal-data
        name: no personal data
        entry: .venv/bin/python scripts/check_personal_data.py
        language: system
        types: [text]
