name: nexahome-edge

# Reverse proxy for local hostnames (ADR 0011). Stateless. Joins the shared network
# nexahome-edge, which `make up` creates; every app reachable by name joins it too.
services:
  edge:
    image: caddy:2.11.7-alpine
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    # Flagged deviation: the Caddy binary carries a file capability, so with every capability
    # dropped it cannot start, although the port is above 1024.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 64m  # about 4x idle RAM, protects the 2 GB VM
    pids_limit: 64
    environment:
      NEXAHOME_DOMAIN: ${NEXAHOME_DOMAIN:-nexahome.localhost}
      EDGE_PORT: ${EDGE_PORT:-8088}
    # The issuer URL contains the port, so the edge listens on the same port inside the network
    # as on the host.
    ports:
      - "127.0.0.1:${EDGE_PORT:-8088}:${EDGE_PORT:-8088}"
    networks:
      edge:
        aliases:
          - id.${NEXAHOME_DOMAIN:-nexahome.localhost}
          - actual.${NEXAHOME_DOMAIN:-nexahome.localhost}
          - home.${NEXAHOME_DOMAIN:-nexahome.localhost}
          - hello.${NEXAHOME_DOMAIN:-nexahome.localhost}
          - gatus.${NEXAHOME_DOMAIN:-nexahome.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:uid=1001,gid=1001
      - /config:uid=1001,gid=1001
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${EDGE_PORT}/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  edge:
    external: true
    name: nexahome-edge
