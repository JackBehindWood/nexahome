name: nexahome-actual

services:
  actual:
    image: actualbudget/actual-server:26.10.0-alpine
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ACTUAL_PORT:-5006}:5006"
    volumes:
      - data:/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5006/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  data:
    labels:
      nexahome.backup: "true"
