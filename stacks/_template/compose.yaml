# Copy this directory to stacks/<name>, then rename the project, service, volume and variables.
# The project name must be nexahome-<directory name>.
name: nexahome-_template

services:
  app:
    image: busybox:1.38.0
    # A placeholder that works: it writes one page into /www and serves it, logging each request (`nexahome logs`).
    # Replace the image and command with your service; keep your service's own data in the volume below.
    command: ["sh", "-c", "echo 'It works. Replace this placeholder with your service.' > /www/index.html && exec httpd -f -vv -p 8080 -h /www"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 64m  # about 4x the idle RAM of your service; measure, then set (protects the 2 GB VM)
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}  # Docker's default json-file never rotates
    ports:
      - "127.0.0.1:${TEMPLATE_PORT:-8081}:8080"
    tmpfs:
      - /www:uid=10001,gid=10001  # read_only is on, so the page needs a writable place
    volumes:
      - data:/data  # your service's data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s

volumes:
  data:
    labels:
      nexahome.backup: "true"  # "true" = backed up; "false" = disposable data
